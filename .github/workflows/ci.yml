name: Python CI Pipeline

on:
  push:
    branches:
      - main
    tags:
      - "v*"
    paths:
      - "app/**"
      - "tests/**"
      - "Dockerfile"
      - "requirements.txt"
      - ".github/workflows/ci.yml"

  pull_request:
    branches:
      - main

permissions:
  contents: write
  packages: write

jobs:
  test:
    name: Run API Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run automated tests
        run: python -m pytest -v

  docker-build:
    name: Build, Scan and Publish Docker Image
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: devops-end-to-end-cicd:latest

      - name: Scan image with Trivy
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: devops-end-to-end-cicd:latest
          format: table
          exit-code: "1"
          ignore-unfixed: true
          vuln-type: os,library
          severity: HIGH,CRITICAL

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish development image to GHCR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/devops-end-to-end-cicd
          IMAGE_TAG: ${{ github.sha }}
        run: |
          IMAGE_NAME=$(echo "$IMAGE_NAME" | tr '[:upper:]' '[:lower:]')
          docker tag devops-end-to-end-cicd:latest "$IMAGE_NAME:$IMAGE_TAG"
          docker push "$IMAGE_NAME:$IMAGE_TAG"

      - name: Publish release image to GHCR
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        env:
          IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/devops-end-to-end-cicd
          IMAGE_TAG: ${{ github.ref_name }}
        run: |
          IMAGE_NAME=$(echo "$IMAGE_NAME" | tr '[:upper:]' '[:lower:]')
          docker tag devops-end-to-end-cicd:latest "$IMAGE_NAME:$IMAGE_TAG"
          docker push "$IMAGE_NAME:$IMAGE_TAG"

      - name: Update Helm image tag
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          IMAGE_TAG: ${{ github.sha }}
        run: |
          sed -i -E "s|^  tag:.*|  tag: \"$IMAGE_TAG\"|" helm/devops-api/values.yaml

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add helm/devops-api/values.yaml

          if git diff --cached --quiet; then
            echo "Helm image tag is already up to date."
          else
            git commit -m "chore: update Helm image tag to $IMAGE_TAG"
            git push
          fi
          
