apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: monitoring
  namespace: argocd

spec:
  project: default

  source:
    repoURL: https://prometheus-community.github.io/helm-charts
    chart: kube-prometheus-stack
    targetRevision: "82.2.1"

    helm:
      releaseName: monitoring
      values: |
        crds:
          enabled: true
          
        grafana:
          enabled: true

          # Disable the init container that fails to change
          # ownership of the persistent volume.
          initChownData:
            enabled: false

          # Run Grafana with its expected user and group.
          podSecurityContext:
            runAsUser: 472
            runAsGroup: 472
            fsGroup: 472
            fsGroupChangePolicy: OnRootMismatch

          persistence:
            enabled: true
            type: pvc
            storageClassName: standard
            accessModes:
              - ReadWriteOnce
            size: 2Gi

          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi

        prometheus:
          enabled: true

          prometheusSpec:
            retention: 7d
            retentionSize: 8GB

            storageSpec:
              volumeClaimTemplate:
                spec:
                  storageClassName: standard
                  accessModes:
                    - ReadWriteOnce
                  resources:
                    requests:
                      storage: 10Gi

            resources:
              requests:
                cpu: 250m
                memory: 512Mi
              limits:
                cpu: 1000m
                memory: 1Gi

        alertmanager:
          enabled: true

          alertmanagerSpec:
            storage:
              volumeClaimTemplate:
                spec:
                  storageClassName: standard
                  accessModes:
                    - ReadWriteOnce
                  resources:
                    requests:
                      storage: 2Gi

            resources:
              requests:
                cpu: 50m
                memory: 64Mi
              limits:
                cpu: 200m
                memory: 256Mi

  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring

  syncPolicy:
    automated:
      prune: true
      selfHeal: true

    syncOptions:
      - CreateNamespace=true
