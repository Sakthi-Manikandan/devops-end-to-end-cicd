apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: devops-api
  labels:
    app: devops-api

spec:
  ingressClassName: nginx
  rules:
    - host: {{ .Values.ingress.host | quote }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: devops-api
                port:
                  number: 8000
